<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KKU Parking Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        /* ซ่อน Scrollbar แต่อยู่ให้เลื่อนได้ */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800">

    <!-- Sidebar (แสดงเฉพาะคอมพิวเตอร์) -->
    <aside class="w-64 bg-white border-r border-slate-200 hidden md:flex flex-col z-20">
        <div class="h-20 flex items-center px-6 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-rose-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">P</div>
                <div>
                    <h2 class="text-sm font-bold text-slate-800 leading-tight">KKU Parking</h2>
                    <p class="text-[10px] text-slate-400 font-medium tracking-wide">ADMIN PORTAL</p>
                </div>
            </div>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-rose-50 text-rose-600 rounded-xl font-medium transition-colors">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                Dashboard
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 hover:text-slate-700 rounded-xl font-medium transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L16 4m0 13V4m0 0L9 7"/></svg>
                Campus Map
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto pb-24 md:pb-0 relative">
        <!-- Header -->
        <header class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-6 sticky top-0 z-10">
            <h1 class="text-lg md:text-xl font-bold text-slate-800">Overview Dashboard</h1>
            
            <!-- Status Badge -->
            <div id="statusBadge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100 text-slate-500 border border-slate-200 text-xs md:text-sm font-medium transition-all duration-300 shadow-sm">
                <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-slate-400 animate-pulse"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </header>

        <!-- Dashboard Content -->
        <div class="p-4 md:p-8 max-w-6xl mx-auto w-full space-y-8">
            
            <!-- Summary Stats -->
            <div>
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Real-Time Capacity</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- Total -->
                    <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-blue-500">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        </div>
                        <div><p class="text-xs text-slate-400 font-medium">Total Spaces</p><h4 class="text-2xl font-bold text-slate-700">5</h4></div>
                    </div>
                    <!-- Available -->
                    <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-500">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <div><p class="text-xs text-slate-400 font-medium">Available</p><h4 id="countAvailable" class="text-2xl font-bold text-slate-700">-</h4></div>
                    </div>
                    <!-- Occupied -->
                    <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-rose-50 flex items-center justify-center text-rose-500">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path></svg>
                        </div>
                        <div><p class="text-xs text-slate-400 font-medium">Occupied</p><h4 id="countOccupied" class="text-2xl font-bold text-slate-700">-</h4></div>
                    </div>
                </div>
            </div>

            <!-- Parking Slots -->
            <div>
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 flex justify-between items-center">
                    Managed Facilities
                    <span class="text-[10px] bg-slate-100 px-2 py-1 rounded text-slate-500">Auto-refresh Active</span>
                </h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="slotsContainer">
                    <!-- Cards จะถูกสร้างด้วย JavaScript อัตโนมัติ -->
                </div>
            </div>
        </div>
    </main>

    <!-- 📱 Bottom Navigation Bar (แสดงเฉพาะบนมือถือ) -->
    <nav class="md:hidden fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-lg border-t border-slate-200 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] rounded-t-[1.5rem] z-50">
        <div class="flex justify-around items-center h-20 px-2 pb-2">
            <a href="#" class="flex flex-col items-center justify-center w-full text-rose-600 transition-transform transform active:scale-90">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                <span class="text-[10px] font-bold">Home</span>
            </a>
            <a href="#" class="flex flex-col items-center justify-center w-full text-slate-400 hover:text-rose-500 transition-transform transform active:scale-90">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L16 4m0 13V4m0 0L9 7"/></svg>
                <span class="text-[10px] font-medium">Map</span>
            </a>
            <a href="#" class="flex flex-col items-center justify-center w-full text-slate-400 hover:text-rose-500 transition-transform transform active:scale-90">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span class="text-[10px] font-medium">History</span>
            </a>
            <a href="#" class="flex flex-col items-center justify-center w-full text-slate-400 hover:text-rose-500 transition-transform transform active:scale-90">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                <span class="text-[10px] font-medium">Profile</span>
            </a>
        </div>
    </nav>

    <!-- JavaScript สำหรับดึงข้อมูลและอัปเดตหน้าจอ -->
    <script>
        // ==========================================
        // 🔴 นำลิงก์ Ngrok ของคุณมาใส่ตรงนี้
        // ==========================================
        const API_URL = "https://anthill-husband-unwatched.ngrok-free.dev/api/status";

        const slots = ["A1", "A2", "A3", "A4", "A5"];
        const slotsContainer = document.getElementById('slotsContainer');
        const badge = document.getElementById('statusBadge');
        const dot = document.getElementById('statusDot');
        const text = document.getElementById('statusText');
        
        // สร้าง Card ช่องจอดรถเตรียมไว้
        slots.forEach(slot => {
            const card = document.createElement('div');
            card.id = `card-${slot}`;
            card.className = "bg-white p-5 rounded-2xl border border-slate-100 shadow-sm transition-all duration-300";
            card.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h4 class="font-bold text-slate-700 text-lg">Zone ${slot}</h4>
                        <p class="text-xs text-slate-400">Parking Slot</p>
                    </div>
                    <span id="status-${slot}" class="px-2.5 py-1 rounded-md text-[10px] font-bold bg-slate-100 text-slate-400">WAITING</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2 mb-2 overflow-hidden">
                    <div id="bar-${slot}" class="bg-slate-300 h-2 rounded-full transition-all duration-500 w-0"></div>
                </div>
            `;
            slotsContainer.appendChild(card);
        });

        // ฟังก์ชันดึงข้อมูลจาก Python
        async function fetchParkingStatus() {
            try {
                // 🚀 หัวใจสำคัญ: ส่ง Header ข้ามหน้าจอแจ้งเตือน Ngrok
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: {
                        "ngrok-skip-browser-warning": "true",
                        "Content-Type": "application/json"
                    }
                });
                
                if (!response.ok) throw new Error("Network response was not ok");
                
                const data = await response.json();
                updateDashboard(data);
                setOnlineStatus(true);
            } catch (error) {
                console.error("Error fetching data:", error);
                setOnlineStatus(false);
            }
        }

        // ฟังก์ชันอัปเดตหน้าจอ
        function updateDashboard(data) {
            let occupiedCount = 0;

            for (const [slot, isOccupied] of Object.entries(data)) {
                const card = document.getElementById(`card-${slot}`);
                const statusBadge = document.getElementById(`status-${slot}`);
                const bar = document.getElementById(`bar-${slot}`);

                if (isOccupied) {
                    occupiedCount++;
                    statusBadge.textContent = "OCCUPIED";
                    statusBadge.className = "px-2.5 py-1 rounded-md text-[10px] font-bold bg-rose-50 text-rose-600 border border-rose-100";
                    bar.className = "bg-rose-500 h-2 rounded-full transition-all duration-500 w-full";
                    card.className = "bg-white p-5 rounded-2xl border border-rose-100 shadow-md transition-all duration-300";
                } else {
                    statusBadge.textContent = "AVAILABLE";
                    statusBadge.className = "px-2.5 py-1 rounded-md text-[10px] font-bold bg-emerald-50 text-emerald-600 border border-emerald-100";
                    bar.className = "bg-emerald-400 h-2 rounded-full transition-all duration-500 w-0";
                    card.className = "bg-white p-5 rounded-2xl border border-slate-100 shadow-sm transition-all duration-300";
                }
            }

            // อัปเดตตัวเลขสรุป
            document.getElementById('countOccupied').textContent = occupiedCount;
            document.getElementById('countAvailable').textContent = 5 - occupiedCount;
        }

        // ฟังก์ชันจัดการปุ่มสถานะมุมขวาบน
        function setOnlineStatus(isOnline) {
            if (isOnline) {
                badge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-200 text-xs md:text-sm font-medium transition-all shadow-sm";
                dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                text.textContent = "Camera Online";
            } else {
                badge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full bg-rose-50 text-rose-600 border border-rose-200 text-xs md:text-sm font-medium transition-all shadow-sm";
                dot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
                text.textContent = "Camera Offline";
            }
        }

        // สั่งให้ดึงข้อมูลทุกๆ 1.5 วินาที
        fetchParkingStatus();
        setInterval(fetchParkingStatus, 1500);

    </script>
</body>
</html>
